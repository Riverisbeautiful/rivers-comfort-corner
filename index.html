<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Safe Space 💜</title>
    <link rel="stylesheet" href="style.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <div class="journal-container">
        <h1>Our Safe Space 💜</h1>

        <!-- Mood Tracker Section -->
        <div class="section-block">
            <h3>How are you feeling today?</h3>
            <input type="range" min="1" max="5" id="moodRange" value="3">
            <div class="mood-labels">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
            </div>
            <button id="sendMoodBtn" class="action-btn">Send Mood Update</button>
        </div>

        <!-- Interactive Step-by-Step Quiz Section -->
        <div class="section-block quiz-section">
            <h3>Our Mini Quiz 🧩</h3>
            
            <!-- Quiz Start Screen -->
            <div id="quizStartScreen" class="quiz-screen text-center">
                <p>Ready to test how well you know us?</p>
                <button id="startQuizBtn" class="action-btn">Start Quiz 🚀</button>
            </div>

            <!-- Active Question Screen (Hidden by default) -->
            <div id="quizPlayScreen" class="quiz-screen" style="display: none;">
                <div id="quizCounter" class="quiz-counter">Question 1 of 9</div>
                <div class="quiz-item active-quiz-item">
                    <p id="quizQuestionText" class="quiz-question-text"></p>
                    <div id="quizOptionsContainer" class="quiz-options"></div>
                    <p id="quizResultText" class="quiz-result"></p>
                </div>
                <button id="nextQuestionBtn" class="action-btn" style="display: none;">Next Question ➡️</button>
            </div>

            <!-- Quiz Results Screen (Hidden by default) -->
            <div id="quizResultScreen" class="quiz-screen" style="display: none; text-align: center;">
                <h4>Quiz Completed! 🎉</h4>
                <p id="quizFinalScore" style="font-weight: bold; font-size: 16px; margin: 10px 0;"></p>
                <p id="quizCuteMessage" style="font-size: 14px; margin-bottom: 15px;"></p>
                <button id="restartQuizBtn" class="action-btn">Retake Quiz 🔄</button>
            </div>
        </div>

        <!-- Journal Entry Section -->
        <div class="section-block">
            <h3>Journal Entry</h3>
            <textarea id="journalInput" placeholder="Write your thoughts here..."></textarea>
            <button id="saveJournalBtn" class="action-btn">Save Entry</button>
        </div>

        <!-- Journal History Section -->
        <div class="section-block">
            <h3>Journal History 📖</h3>
            <div id="journalHistoryList">Loading entries...</div>
        </div>

        <!-- Extras Section: Play Snake Button -->
        <div class="extras-section">
            <button id="snakeBtn" class="action-btn">Play Snake 🐍</button>
        </div>
    </div>

    <!-- Prize Popup Modal (For Perfect Score) -->
    <div id="prizeOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <h3>🏆 Perfect Score! 🏆</h3>
            <p style="font-size: 14px; text-align: center; margin-bottom: 15px;">You know us inside and out! Pick your prize:</p>
            <div class="prize-options-list" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                <button class="action-btn prize-btn" data-prize="Meta Horizon Plus">Meta Horizon Plus 🥽</button>
                <button class="action-btn prize-btn" data-prize="Switch Game of Choice">Switch Game of Choice 🎮</button>
                <button class="action-btn prize-btn" data-prize="1 Thing Off Your Wishlist">1 Thing Off Your Wishlist ✨</button>
            </div>
            <p id="prizeSelectionResult" style="margin-top: 15px; font-weight: bold; font-size: 13px; text-align: center;"></p>
            <button id="closePrizeBtn" class="action-btn" style="margin-top: 15px; background-color: #888;">Close</button>
        </div>
    </div>

    <!-- Snake Game Overlay Modal -->
    <div id="snakeOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <h3>Classic Snake 🐍</h3>
            <canvas id="snakeCanvas" width="280" height="280"></canvas>
            <p id="snakeScore">Score: 0</p>
            
            <div class="snake-controls">
                <div></div>
                <button id="upBtn" class="action-btn">⬆️</button>
                <div></div>
                <button id="leftBtn" class="action-btn">⬅️</button>
                <button id="downBtn" class="action-btn">⬇️</button>
                <button id="rightBtn" class="action-btn">➡️</button>
            </div>

            <div class="snake-modal-buttons">
                <button id="startSnakeBtn" class="action-btn">Start Game</button>
                <button id="closeSnakeBtn" class="action-btn">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
