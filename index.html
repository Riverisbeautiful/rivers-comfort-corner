<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Digital Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: url('toby.jpg') no-repeat center center fixed; background-size: cover;">

    <div class="journal-container" style="background: rgba(255, 255, 255, 0.85); padding: 20px; border-radius: 12px; max-width: 600px; margin: 40px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h1>Our Digital Journal 💜</h1>
        
        <!-- Other sections (Journal Entries, Mood Tracker, Quiz, etc.) go here -->

        <!-- Extras Section: Play Snake Button -->
        <div class="extras-section" style="margin-top: 20px; text-align: center;">
            <button id="snakeBtn" class="action-btn">Play Snake 🐍</button>
        </div>
    </div>

    <!-- Snake Game Overlay Modal -->
    <div id="snakeOverlay" class="overlay" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div class="overlay-content" style="background: #ffffff; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; max-width: 320px; width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h3 style="margin-bottom: 10px; color: #d680a1;">Classic Snake 🐍</h3>
            <canvas id="snakeCanvas" width="280" height="280" style="background: #fdf8fa; border: 2px solid #d680a1; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05);"></canvas>
            <p id="snakeScore" style="color: #d680a1; font-weight: bold; margin: 8px 0;">Score: 0</p>
            
            <!-- On-Screen D-Pad for Mobile -->
            <div class="snake-controls" style="display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; margin-bottom: 15px; justify-content: center;">
                <div></div>
                <button id="upBtn" class="action-btn" style="padding: 10px; font-size: 16px; cursor: pointer; touch-action: manipulation;">⬆️</button>
                <div></div>
                <button id="leftBtn" class="action-btn" style="padding: 10px; font-size: 16px; cursor: pointer; touch-action: manipulation;">⬅️</button>
                <button id="downBtn" class="action-btn" style="padding: 10px; font-size: 16px; cursor: pointer; touch-action: manipulation;">⬇️</button>
                <button id="rightBtn" class="action-btn" style="padding: 10px; font-size: 16px; cursor: pointer; touch-action: manipulation;">➡️</button>
            </div>

            <div style="display: flex; gap: 10px; width: 100%; justify-content: center;">
                <button id="startSnakeBtn" class="action-btn" style="cursor: pointer;">Start Game</button>
                <button id="closeSnakeBtn" class="action-btn" style="cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <!-- Your Main Script File -->
    <script src="script.js"></script>
</body>
</html>
