<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Digital Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Our Safe Space 💜</h1>
        </header>

        <!-- Mood Section -->
        <div class="mood-section">
            <h3>How are you feeling today?</h3>
            <input type="range" min="1" max="10" value="5" class="slider" id="mood-slider">
            <p id="mood-text">Mood Level: <span id="mood-value">5</span></p>
        </div>

        <!-- Mini Quiz Section -->
        <div class="quiz-section">
            <h3>Mini Quiz 💜</h3>
            <div id="quiz-container">
                <p id="question-text">Loading question...</p>
                <div id="answer-buttons" class="btn-grid">
                    <!-- Buttons will be generated here by JavaScript -->
                </div>
            </div>
            <div id="score-container" class="hide">
                <p id="score-text"></p>
                <button id="restart-btn" class="hide">Play Again</button>
            </div>
        </div>

        <!-- Journal Entry Section -->
        <div class="journal-section">
            <h3>Journal</h3>
            <textarea id="journal-entry" placeholder="Write your thoughts here..."></textarea>
            <button id="save-btn">Save Entry</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
