<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Digital Journal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Our Safe Space 💜</h1>
        </header>

        <!-- Mood Section -->
        <div class="mood-section">
            <h3>How are you feeling today?</h3>
            <input type="range" min="1" max="5" value="3" class="slider" id="moodSlider">
            <button id="sendMoodBtn" class="action-btn">Send Mood Update</button>
        </div>

        <!-- Mini Quiz Section -->
        <div class="quiz-section">
            <h3>Mini Quiz 💜</h3>
            <div id="quiz-container">
                <p id="question-text">Loading question...</p>
                <div id="answer-buttons" class="btn-grid"></div>
            </div>
            <div id="score-container" class="hide">
                <p id="score-text"></p>
                <button id="restart-btn" class="hide">Play Again</button>
            </div>
        </div>

        <!-- Interactive Extras -->
        <div class="extras-section">
            <button id="hugBtn" class="action-btn">Send a Hug 🤗</button>
            <button id="gameBtn" class="action-btn">Daily Affirmation ✨</button>
        </div>

        <!-- Journal Entry Section -->
        <div class="journal-section">
            <h3>Journal Entry</h3>
            <textarea id="riverNote" placeholder="Write your thoughts here..."></textarea>
            <button id="sendBtn" class="action-btn">Save Entry</button>
        </div>

        <!-- Journal History Section (Fixed ID) -->
        <div class="history-section">
            <h3>Journal History 📖</h3>
            <div id="entriesList">
                <p style="font-size:12px; color:#888; text-align:center;">Loading entries...</p>
            </div>
        </div>
    </div>

    <!-- Hug Overlay Modal -->
    <div id="hugOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <p>🤗 *Sending you the tightest, warmest hug right now!* 🤗</p>
            <button id="closeHugBtn" class="action-btn">Close</button>
        </div>
    </div>

    <!-- Affirmation Overlay Modal -->
    <div id="gameOverlay" class="overlay" style="display:none;">
        <div class="overlay-content">
            <p id="affirmationText">Loading...</p>
            <button id="closeGameBtn" class="action-btn">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
